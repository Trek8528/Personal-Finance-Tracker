spring.application.name=finance-tracker

server.port=${PORT:8080}

# Database configuration — accepts MYSQL_URL, DATABASE_URL, or standard Spring variables
spring.datasource.url=${MYSQL_URL:${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/finance_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}}
spring.datasource.username=${MYSQL_USER:${DATABASE_USER:${SPRING_DATASOURCE_USERNAME:root}}}
spring.datasource.password=${MYSQL_PASSWORD:${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:1004}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Explicit MySQL dialect so Hibernate doesn't fail on metadata inspection
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT configuration
app.jwt.secret=${JWT_SECRET:FinanceTrackerDevSecretKeyMustBeAtLeast32Chars!}
app.jwt.expiration-ms=604800000
