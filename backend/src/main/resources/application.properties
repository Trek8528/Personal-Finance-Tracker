spring.application.name=finance-tracker

server.port=${PORT:8080}

# Database configuration — uses environment variables on cloud, falls back to local MySQL
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/finance_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:1004}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT configuration
app.jwt.secret=${JWT_SECRET:FinanceTrackerDevSecretKeyMustBeAtLeast32Chars!}
app.jwt.expiration-ms=604800000
