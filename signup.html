<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-Up</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="11782361.png" />
  </head>
  <body>
    <nav class="nav-bar">
      <a href="#" class="logo">
        <span class="navbar-logo"
          ><img src="11782361.png" alt="Finance Tracker Logo"
        /></span>
        <span>Finance Tracker</span>
      </a>
      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">About us</a>
        <a href="login.html" class="nav-button">Login</a>
      </div>
    </nav>
    <main class="authbox">
      <div class="wrapper">
        <div class="signup">
          <div class="signup-text">
            <h1>Create Account</h1>
            <p>Start Tracking expenses now!!!</p>
            <div class="error-msg">
            </div>
          </div>
          <form action="#" method="post">
            <div class="form-group">
              <div class="name-group">
                <div class="input-icon">
                  <label for="firstname">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      height="24px"
                      viewBox="0 -960 960 960"
                      width="24px"
                      fill="#0b0909"
                    >
                      <path
                        d="M680-240v-80h200v80H680Zm-80-200v-80h280v80H600Zm-80-200v-80h360v80H520ZM235-515q-35-35-35-85t35-85q35-35 85-35t85 35q35 35 35 85t-35 85q-35 35-85 35t-85-35ZM80-240v-76q0-21 10-40t28-30q45-27 95.5-40.5T320-440q56 0 106.5 13.5T522-386q18 11 28 30t10 40v76H80Zm160-110q-39 10-74 30h308q-35-20-74-30t-80-10q-41 0-80 10Zm108.5-221.5Q360-583 360-600t-11.5-28.5Q337-640 320-640t-28.5 11.5Q280-617 280-600t11.5 28.5Q303-560 320-560t28.5-11.5ZM320-600Zm0 280Z"
                      />
                    </svg>
                  </label>
                  <input
                    type="text"
                    name="firstname"
                    placeholder="Enter First Name"
                    id="firstname"
                    class="inputarea"
                    required
                  />
                </div>
                <div class="input-icon">
                  <label for="lastname"
                    ><svg
                      xmlns="http://www.w3.org/2000/svg"
                      height="24px"
                      viewBox="0 -960 960 960"
                      width="24px"
                      fill="#0b0909"
                    >
                      <path
                        d="M680-240v-80h200v80H680Zm-80-200v-80h280v80H600Zm-80-200v-80h360v80H520ZM235-515q-35-35-35-85t35-85q35-35 85-35t85 35q35 35 35 85t-35 85q-35 35-85 35t-85-35ZM80-240v-76q0-21 10-40t28-30q45-27 95.5-40.5T320-440q56 0 106.5 13.5T522-386q18 11 28 30t10 40v76H80Zm160-110q-39 10-74 30h308q-35-20-74-30t-80-10q-41 0-80 10Zm108.5-221.5Q360-583 360-600t-11.5-28.5Q337-640 320-640t-28.5 11.5Q280-617 280-600t11.5 28.5Q303-560 320-560t28.5-11.5ZM320-600Zm0 280Z"
                      />
                    </svg>
                  </label>
                  <input
                    type="text"
                    name="lastname"
                    placeholder="Enter Last Name"
                    ,
                    id="lastname"
                    class="inputarea"
                    required
                  />
                </div>
              </div>
              <div class="input-icon">
                <label for="phone">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    height="24px"
                    viewBox="0 -960 960 960"
                    width="24px"
                    fill="#0b0909"
                  >
                    <path
                      d="M760-480q0-117-81.5-198.5T480-760v-80q75 0 140.5 28.5t114 77q48.5 48.5 77 114T840-480h-80Zm-160 0q0-50-35-85t-85-35v-80q83 0 141.5 58.5T680-480h-80Zm198 360q-125 0-247-54.5T329-329Q229-429 174.5-551T120-798q0-18 12-30t30-12h162q14 0 25 9.5t13 22.5l26 140q2 16-1 27t-11 19l-97 98q20 37 47.5 71.5T387-386q31 31 65 57.5t72 48.5l94-94q9-9 23.5-13.5T670-390l138 28q14 4 23 14.5t9 23.5v162q0 18-12 30t-30 12ZM241-600l66-66-17-94h-89q5 41 14 81t26 79Zm358 358q39 17 79.5 27t81.5 13v-88l-94-19-67 67ZM241-600Zm358 358Z"
                    />
                  </svg>
                </label>
                <input
                  type="tel"
                  name="phone"
                  placeholder="Enter Phone number"
                  id="phone"
                  class="inputarea"
                  required
                />
              </div>
              <div class="input-icon">
                <label for="email"
                  ><svg
                    xmlns="http://www.w3.org/2000/svg"
                    height="24px"
                    viewBox="0 -960 960 960"
                    width="24px"
                    fill="#0b0909"
                  >
                    <path
                      d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480v58q0 59-40.5 100.5T740-280q-35 0-66-15t-52-43q-29 29-65.5 43.5T480-280q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480v58q0 26 17 44t43 18q26 0 43-18t17-44v-58q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93h200v80H480Zm85-315q35-35 35-85t-35-85q-35-35-85-35t-85 35q-35 35-35 85t35 85q35 35 85 35t85-35Z"
                    />
                  </svg>
                </label>
                <input
                  type="email"
                  ,name="email"
                  placeholder="Enter email"
                  ,
                  id="email"
                  class="inputarea"
                  required
                />
              </div>
              <div class="input-icon">
                <label for="password">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    height="24px"
                    viewBox="0 -960 960 960"
                    width="24px"
                    fill="#0b0909"
                  >
                    <path
                      d="M80-200v-80h800v80H80Zm46-242-52-30 34-60H40v-60h68l-34-58 52-30 34 58 34-58 52 30-34 58h68v60h-68l34 60-52 30-34-60-34 60Zm320 0-52-30 34-60h-68v-60h68l-34-58 52-30 34 58 34-58 52 30-34 58h68v60h-68l34 60-52 30-34-60-34 60Zm320 0-52-30 34-60h-68v-60h68l-34-58 52-30 34 58 34-58 52 30-34 58h68v60h-68l34 60-52 30-34-60-34 60Z"
                    />
                  </svg>
                </label>
                <input
                  type="password"
                  ,name="password"
                  placeholder="Enter password"
                  ,
                  id="password"
                  class="inputarea"
                  required
                />
              </div>
              <div class="input-icon">
                <label for="r_password"
                  ><svg
                    xmlns="http://www.w3.org/2000/svg"
                    height="24px"
                    viewBox="0 -960 960 960"
                    width="24px"
                    fill="#0b0909"
                  >
                    <path
                      d="M80-200v-80h800v80H80Zm46-242-52-30 34-60H40v-60h68l-34-58 52-30 34 58 34-58 52 30-34 58h68v60h-68l34 60-52 30-34-60-34 60Zm320 0-52-30 34-60h-68v-60h68l-34-58 52-30 34 58 34-58 52 30-34 58h68v60h-68l34 60-52 30-34-60-34 60Zm320 0-52-30 34-60h-68v-60h68l-34-58 52-30 34 58 34-58 52 30-34 58h68v60h-68l34 60-52 30-34-60-34 60Z"
                    />
                  </svg>
                </label>
                <input
                  type="password"
                  name="r_password"
                  placeholder="Enter password again"
                  id="r_password"
                  class="inputarea"
                  required
                />
              </div>
              <div class="submit-form">
                <button type="submit">Create Account</button>
              </div>
              <div class="redirect-login">
                Already have an Account?<a href="login.html">Login</a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
