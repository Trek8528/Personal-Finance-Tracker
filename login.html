<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login-Page</title>
    <link rel="stylesheet" href="style2.css" />
    <link rel="icon" type="image/png" href="11782361.png" />
  </head>
  <body>
    <nav class="nav-bar">
      <a href="#" class="logo">
        <span class="navbar-logo"
          ><img src="11782361.png" alt="Finance Tracker Logo"
        /></span>
        <span>Finance Tracker</span>
      </a>
      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">About us</a>
        <a href="signup.html" class="nav-button">Sign Up</a>
      </div>
    </nav>
    <main class="authbox">
      <div class="wrapper">
        <div class="login">
          <div class="login-text">
            <h1>Login Now</h1>
            <p>Resume Tracking your expenses</p>
          </div>
          <form action="#" method="post">
            <div class="form-group">
              <div class="input-icon">
                <label for="email"
                  ><svg
                    xmlns="http://www.w3.org/2000/svg"
                    height="24px"
                    viewBox="0 -960 960 960"
                    width="24px"
                    fill="#0b0909"
                  >
                    <path
                      d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480v58q0 59-40.5 100.5T740-280q-35 0-66-15t-52-43q-29 29-65.5 43.5T480-280q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480v58q0 26 17 44t43 18q26 0 43-18t17-44v-58q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93h200v80H480Zm85-315q35-35 35-85t-35-85q-35-35-85-35t-85 35q-35 35-35 85t35 85q35 35 85 35t85-35Z"
                    />
                  </svg>
                </label>
                <input
                  type="email"
                  name="email"
                  placeholder="Enter email"
                  id="emaillogin"
                  class="inputarea"
                  required
                />
              </div>
              <div class="input-icon">
                <label for="password">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    height="24px"
                    viewBox="0 -960 960 960"
                    width="24px"
                    fill="#0b0909"
                  >
                    <path
                      d="M80-200v-80h800v80H80Zm46-242-52-30 34-60H40v-60h68l-34-58 52-30 34 58 34-58 52 30-34 58h68v60h-68l34 60-52 30-34-60-34 60Zm320 0-52-30 34-60h-68v-60h68l-34-58 52-30 34 58 34-58 52 30-34 58h68v60h-68l34 60-52 30-34-60-34 60Zm320 0-52-30 34-60h-68v-60h68l-34-58 52-30 34 58 34-58 52 30-34 58h68v60h-68l34 60-52 30-34-60-34 60Z"
                    />
                  </svg>
                </label>
                <input
                  type="password"
                  name="password"
                  placeholder="Enter password"
                  id="passwordlogin"
                  class="inputarea"
                  required
                />
              </div>
              <div class="submit-button">
                <button type="submit">Login</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
